name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v6

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos do portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar o portal
        id: publicacao
        uses: actions/deploy-pages@v4
